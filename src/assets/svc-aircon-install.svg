<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe4"/>
      <stop offset="1" stop-color="#e7dfcf"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe6f5"/>
      <stop offset="1" stop-color="#a9cbe2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48a5e"/>
      <stop offset="1" stop-color="#8f6a45"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="960" fill="url(#wall)"/>
  <!-- window -->
  <rect x="860" y="250" width="300" height="420" fill="#ffffff"/>
  <rect x="876" y="266" width="268" height="388" fill="url(#window)"/>
  <rect x="1006" y="266" width="8" height="388" fill="#ffffff"/>
  <rect x="876" y="456" width="268" height="8" fill="#ffffff"/>
  <path d="M900 640 L960 520 L1010 600 L1060 540 L1130 640 Z" fill="#8fb7d1" opacity="0.6"/>
  <rect x="840" y="670" width="340" height="18" fill="#ffffff"/>
