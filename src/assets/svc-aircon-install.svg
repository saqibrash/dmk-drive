  <rect x="740" y="690" width="70" height="90" rx="8" fill="#e8e2d6"/>
  <path d="M775 690 C740 620 700 600 690 560 C730 580 760 620 775 690 Z" fill="#4f7a4a"/>
  <path d="M775 690 C790 610 830 580 860 560 C845 610 810 650 775 690 Z" fill="#5f8d58"/>
  <path d="M775 690 C770 620 775 570 790 520 C800 580 795 640 775 690 Z" fill="#456c40"/>
  <!-- air flow -->
  <path d="M250 300 Q 420 520 300 640 L 760 640 Q 640 520 790 300 Z" fill="url(#air)"/>
  <g fill="none" stroke="#7fc1f5" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M330 320 q20 40 0 80 q-20 40 0 80"/>
    <path d="M520 320 q20 40 0 80 q-20 40 0 80 q20 40 0 80"/>
    <path d="M710 320 q20 40 0 80 q-20 40 0 80"/>
  </g>
  <!-- indoor split unit -->
  <rect x="210" y="170" width="620" height="150" rx="30" fill="#000" opacity="0.08" transform="translate(6 10)"/>
  <rect x="210" y="170" width="620" height="150" rx="30" fill="url(#unit)"/>
  <rect x="210" y="268" width="620" height="52" rx="22" fill="#dfe3e7"/>
  <rect x="250" y="282" width="540" height="20" rx="10" fill="#c3c9cf"/>
