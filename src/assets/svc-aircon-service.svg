    <line x1="720" y1="860" x2="640" y2="560"/>
  </g>
  <g fill="#9aa1a8"><rect x="560" y="640" width="130" height="14" rx="4"/><rect x="545" y="720" width="160" height="14" rx="4"/><rect x="530" y="800" width="190" height="14" rx="4"/></g>
  <rect x="580" y="548" width="90" height="22" rx="6" fill="#ffd400"/>
  <!-- engineer -->
  <g>
    <path d="M598 548 L592 420 L654 420 L648 548 Z" fill="#20242a"/>
    <path d="M586 300 Q623 286 660 300 L668 430 L578 430 Z" fill="#17191d"/>
    <rect x="580" y="330" width="86" height="14" fill="#ffd400"/>
    <text x="623" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffd400" text-anchor="middle">DMK</text>
    <path d="M590 310 L560 250 L600 228" stroke="#17191d" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M656 310 L700 260 L740 260" stroke="#17191d" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="623" cy="262" r="30" fill="#c99a76"/>
    <path d="M593 256 Q623 222 653 256 L653 246 Q623 214 593 246 Z" fill="#1b1b1b"/>
  </g>
  <!-- filter being removed -->
  <g transform="rotate(-8 800 270)">
    <rect x="730" y="236" width="200" height="70" rx="6" fill="#e9ecef" stroke="#b3bbc3" stroke-width="3"/>
    <g stroke="#c9cfd5" stroke-width="2">
      <line x1="740" y1="250" x2="920" y2="250"/><line x1="740" y1="264" x2="920" y2="264"/>
      <line x1="740" y1="278" x2="920" y2="278"/><line x1="740" y1="292" x2="920" y2="292"/>
    </g>
  </g>
  <!-- service checklist on clipboard -->
  <g transform="translate(980 560) rotate(6)">
    <rect x="0" y="0" width="200" height="260" rx="10" fill="#7a5a3a"/>
    <rect x="14" y="26" width="172" height="220" fill="#ffffff"/>
    <rect x="70" y="-10" width="60" height="26" rx="6" fill="#9aa1a8"/>
    <g fill="none" stroke="#1faf54" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 70 l10 10 l18 -20"/><path d="M30 120 l10 10 l18 -20"/><path d="M30 170 l10 10 l18 -20"/>
    </g>
    <g fill="#c3c9cf"><rect x="70" y="66" width="96" height="10" rx="5"/><rect x="70" y="116" width="96" height="10" rx="5"/><rect x="70" y="166" width="96" height="10" rx="5"/><rect x="70" y="210" width="96" height="10" rx="5"/></g>
  </g>
  <!-- spray bottle -->
  <g transform="translate(160 720)">
    <rect x="0" y="40" width="70" height="100" rx="14" fill="#1d5fbf"/>
    <rect x="18" y="10" width="34" height="34" fill="#2b2f33"/>
    <path d="M52 16 h40 v12 h-40 Z" fill="#2b2f33"/>
    <rect x="10" y="70" width="50" height="40" rx="4" fill="#ffffff" opacity="0.85"/>
