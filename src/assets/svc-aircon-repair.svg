<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960">
  <defs>
    <pattern id="brick" width="120" height="60" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#a65a3c"/>
      <rect x="2" y="2" width="116" height="26" fill="#b5653f"/>
      <rect x="-58" y="32" width="116" height="26" fill="#ad5f3d"/>
      <rect x="62" y="32" width="116" height="26" fill="#b86a45"/>
    </pattern>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#dcdfe2"/>
    </linearGradient>
    <radialGradient id="fan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a3f45"/>
      <stop offset="1" stop-color="#16181b"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="960" fill="url(#brick)"/>
  <rect width="1280" height="960" fill="#000" opacity="0.08"/>
  <!-- ground -->
  <rect x="0" y="830" width="1280" height="130" fill="#6f6a63"/>
  <rect x="0" y="826" width="1280" height="8" fill="#5c5852"/>
  <!-- wall brackets -->
  <path d="M250 640 L250 760 L300 760 L300 700 Z" fill="#2b2f33"/>
  <path d="M780 640 L780 760 L830 760 L830 700 Z" fill="#2b2f33"/>
  <rect x="200" y="630" width="680" height="18" fill="#3a3f45"/>
  <!-- outdoor condenser -->
  <rect x="210" y="300" width="660" height="330" rx="14" fill="#000" opacity="0.18" transform="translate(10 14)"/>
  <rect x="210" y="300" width="660" height="330" rx="14" fill="url(#case)"/>
  <circle cx="440" cy="465" r="135" fill="#c9ced3"/>
  <circle cx="440" cy="465" r="122" fill="url(#fan)"/>
  <g stroke="#9aa1a8" stroke-width="3" fill="none" opacity="0.8">
    <circle cx="440" cy="465" r="122"/><circle cx="440" cy="465" r="96"/><circle cx="440" cy="465" r="70"/><circle cx="440" cy="465" r="44"/>
    <line x1="318" y1="465" x2="562" y2="465"/><line x1="440" y1="343" x2="440" y2="587"/>
  </g>
  <circle cx="440" cy="465" r="18" fill="#9aa1a8"/>
  <g fill="#d6dade">
    <rect x="620" y="340" width="210" height="12" rx="4"/><rect x="620" y="366" width="210" height="12" rx="4"/>
    <rect x="620" y="392" width="210" height="12" rx="4"/><rect x="620" y="418" width="210" height="12" rx="4"/>
    <rect x="620" y="444" width="210" height="12" rx="4"/><rect x="620" y="470" width="210" height="12" rx="4"/>
  </g>
  <rect x="620" y="520" width="210" height="70" rx="6" fill="#e4e7ea"/>
  <!-- service valves + copper -->
  <rect x="870" y="520" width="40" height="22" fill="#b87333"/>
  <rect x="870" y="560" width="40" height="22" fill="#b87333"/>
  <path d="M910 531 H960 V180" stroke="#b87333" stroke-width="16" fill="none"/>
  <path d="M910 571 H990 V180" stroke="#c98a4a" stroke-width="12" fill="none"/>
  <rect x="944" y="160" width="62" height="40" fill="#ffffff" opacity="0.9"/>
  <!-- manifold gauges -->
  <g transform="translate(980 600)">
    <path d="M-60 -20 C -140 60, -60 140, -100 220" stroke="#1d5fbf" stroke-width="10" fill="none"/>
    <path d="M60 -20 C 140 60, 60 140, 100 220" stroke="#c0392b" stroke-width="10" fill="none"/>
    <path d="M0 0 C 0 60, 20 140, 0 220" stroke="#ffd400" stroke-width="10" fill="none"/>
    <rect x="-130" y="-120" width="260" height="110" rx="18" fill="#2b2f33"/>
    <circle cx="-60" cy="-120" r="62" fill="#1d5fbf"/>
    <circle cx="-60" cy="-120" r="50" fill="#ffffff"/>
    <line x1="-60" y1="-120" x2="-30" y2="-150" stroke="#171717" stroke-width="5" stroke-linecap="round"/>
    <circle cx="60" cy="-120" r="62" fill="#c0392b"/>
    <circle cx="60" cy="-120" r="50" fill="#ffffff"/>
    <line x1="60" y1="-120" x2="80" y2="-85" stroke="#171717" stroke-width="5" stroke-linecap="round"/>
    <rect x="-150" y="-40" width="40" height="30" rx="6" fill="#1d5fbf"/>
    <rect x="110" y="-40" width="40" height="30" rx="6" fill="#c0392b"/>
  </g>
  <!-- tool bag -->
  <path d="M90 830 q70 -30 150 0 l-14 -110 h-122 Z" fill="#20242a"/>
  <rect x="80" y="760" width="170" height="70" rx="10" fill="#20242a"/>
  <rect x="80" y="760" width="170" height="14" fill="#ffd400"/>
  <path d="M120 760 q45 -50 90 0" stroke="#3a3a3a" stroke-width="8" fill="none"/>
</svg>
