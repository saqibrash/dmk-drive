  <rect x="0" y="780" width="1280" height="180" fill="url(#floor)"/>
  <rect x="0" y="766" width="1280" height="16" fill="#ffffff"/>
  <!-- sofa -->
  <rect x="120" y="610" width="560" height="170" rx="26" fill="#2b2f33"/>
  <rect x="140" y="560" width="520" height="110" rx="24" fill="#353a40"/>
  <rect x="96" y="600" width="70" height="170" rx="22" fill="#24282c"/>
  <rect x="634" y="600" width="70" height="170" rx="22" fill="#24282c"/>
  <rect x="210" y="580" width="120" height="80" rx="14" fill="#ffd400"/>
  <rect x="140" y="780" width="18" height="30" fill="#1b1b1b"/>
  <rect x="644" y="780" width="18" height="30" fill="#1b1b1b"/>
