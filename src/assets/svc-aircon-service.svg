<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f3"/>
      <stop offset="1" stop-color="#dde2e6"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7eaee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="960" fill="url(#wall)"/>
  <rect x="0" y="860" width="1280" height="100" fill="#c9c2b5"/>
  <!-- indoor unit, front cover lifted -->
  <rect x="300" y="200" width="680" height="170" rx="30" fill="#000" opacity="0.08" transform="translate(6 10)"/>
  <rect x="300" y="200" width="680" height="170" rx="30" fill="url(#unit)"/>
  <rect x="330" y="232" width="620" height="100" rx="10" fill="#cfd5db"/>
  <g stroke="#b3bbc3" stroke-width="4">
    <line x1="350" y1="246" x2="930" y2="246"/><line x1="350" y1="262" x2="930" y2="262"/>
    <line x1="350" y1="278" x2="930" y2="278"/><line x1="350" y1="294" x2="930" y2="294"/>
    <line x1="350" y1="310" x2="930" y2="310"/>
  </g>
  <path d="M300 200 L980 200 L1000 110 L320 110 Z" fill="#f7f8fa" stroke="#dfe3e7" stroke-width="3"/>
  <rect x="300" y="330" width="680" height="40" rx="18" fill="#dfe3e7"/>
  <!-- step ladder -->
  <g stroke="#9aa1a8" stroke-width="16" stroke-linecap="round">
